name: flutter_pas_tabler_icons
description: A Flutter package for Tabler Icons. Includes over 6000+ icons in both Outline and Filled variants, fully tree-shakeable.
version: 3.44.0
homepage: https://github.com/pasdeveloper/flutter_tabler_icons
repository: https://github.com/pasdeveloper/flutter_tabler_icons
issue_tracker: https://github.com/pasdeveloper/flutter_tabler_icons/issues

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  fonts:
    - family: tabler-icons
      fonts:
        - asset: assets/fonts/tabler-icons.ttf
    - family: tabler-icons-filled
      fonts:
        - asset: assets/fonts/tabler-icons-filled.ttf
